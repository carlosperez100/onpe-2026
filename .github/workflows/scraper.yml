name: ONPE Scraper Horario

on:
  schedule:
    # Cada 15 minutos (UTC). Perú = UTC-5
    - cron: '*/15 * * * *'
  workflow_dispatch:        # Permite ejecutar manualmente desde la pestaña Actions

permissions:
  contents: write           # Para hacer commit de los datos actualizados

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper ONPE
        run: python scraper/onpe_scraper.py

      - name: Commit y push de datos
        run: |
          git config user.name "onpe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
