name: ONPE Scraper Horario

on:
  schedule:
    - cron: '*/15 * * * *'  # Cada 15 minutos UTC
  workflow_dispatch:  # Trigger manual desde Actions

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: /home/runner/work/.cache/ms-playwright

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium
      - name: Run scraper
        run: python scraper/onpe_scraper.py
        continue-on-error: true
      - name: Commit & push
        run: |
          git config user.name "onpe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%S%z)"
            git push
          fi
